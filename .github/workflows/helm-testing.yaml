name: Lint and Test Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/fabric/**'
      - '.github/workflows/helm-testing.yaml'
  pull_request:
    paths:
      - 'charts/fabric/**'
      - '.github/workflows/helm-testing.yaml'

permissions: {}

env:
  KIND_VERSION: v0.32.0

jobs:
  lint:
    name: Lint chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --config charts/fabric/ct.yaml

  install:
    name: Install chart
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    strategy:
      matrix:
        ip-family: [ "ipv4" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Install kind
        uses: helm/kind-action@v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Create kind cluster
        run: |
          sudo pip3 install jinjanator j2cli
          sudo PATH=~/.local/bin:$PATH make kind-init-${{ matrix.ip-family }}
          sudo cp -r /root/.kube/ ~/.kube/
          sudo chown -R $(id -un). ~/.kube/

      - name: Run chart-testing (install)
        id: install
        run: |
          timeout 120 bash -c 'until kubectl get node -l node-role.kubernetes.io/control-plane -o name 2>/dev/null | grep -q .; do echo "Waiting for control-plane nodes to be labeled..."; sleep 2; done'
          kubectl label node --overwrite -l node-role.kubernetes.io/control-plane fabric/role=master
          ct install --config charts/fabric/ct.yaml

      - name: Check kube ovn pod restarts
        if: ${{ success() || (failure() && steps.install.conclusion == 'failure') }}
        run: make check-fabric-pod-restarts
