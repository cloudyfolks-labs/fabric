name: Mirror Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror external images to ghcr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror kind node image
        run: |
          K8S_VERSION=$(sed -n 's/^K8S_VERSION ?= //p' makefiles/kind.mk)
          docker buildx imagetools create \
            -t "ghcr.io/cloudyfolks-labs/kindest-node:$K8S_VERSION" \
            "docker.io/kindest/node:$K8S_VERSION"

      - name: Mirror kube-ovn base images
        run: |
          TAG=$(cat BASE_VERSION)
          docker buildx imagetools create \
            -t "ghcr.io/cloudyfolks-labs/kube-ovn-base:$TAG" \
            "docker.io/kubeovn/kube-ovn-base:$TAG"
          docker buildx imagetools create \
            -t "ghcr.io/cloudyfolks-labs/kube-ovn-base:$TAG-debug" \
            "docker.io/kubeovn/kube-ovn-base:$TAG-debug" || true
