apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fabric-bfdd
  namespace: monitoring
spec:
  groups:
    - name: fabric-bfdd
      rules:
        - alert: FabricBFDSessionRecoveryCircuitOpen
          annotations:
            description: BFD session {{ $labels.local }} to {{ $labels.remote }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has exhausted automatic recovery.
            summary: fabric BFD session recovery circuit is open
          expr: kube_ovn_bfdd_circuit_open == 1
          for: 5m
          labels:
            severity: warning
        - alert: FabricBFDChildRecoveryCircuitOpen
          annotations:
            description: OpenBFDD child recovery in pod {{ $labels.namespace }}/{{ $labels.pod }} has exhausted its automatic restart budget.
            summary: fabric OpenBFDD child recovery circuit is open
          expr: kube_ovn_bfdd_child_circuit_open == 1
          for: 5m
          labels:
            severity: warning
        - alert: FabricBFDZeroSessions
          annotations:
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has had no Up BFD sessions for more than five minutes.
            summary: fabric BFD has no Up sessions
          expr: kube_ovn_bfdd_session_zero_seconds > 300
          labels:
            severity: warning
        - alert: FabricBFDRecoveryFailure
          annotations:
            description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has failed a BFD recovery action during the last ten minutes.
            summary: fabric BFD recovery action failed
          expr: increase(kube_ovn_bfdd_recovery_attempts_total{result="error"}[10m]) > 0
          labels:
            severity: warning
