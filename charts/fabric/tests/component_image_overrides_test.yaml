suite: Component image overrides
templates:
  - controller/controller-deployment.yaml
  - agent/agent-daemonset.yaml
tests:
  - it: overrides only the controller image
    template: controller/controller-deployment.yaml
    set:
      masterNodes:
        - "10.0.0.1"
      controller.image.repository: fabric-controller-dev
      controller.image.tag: custom-controller
      controller.image.registry: ghcr.io/example
      controller.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: ghcr.io/example/fabric-controller-dev:custom-controller
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/example/fabric-controller-dev:custom-controller
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  - it: keeps other components on the global image by default
    template: agent/agent-daemonset.yaml
    set:
      masterNodes:
        - "10.0.0.1"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cloudyfolks-labs/fabric:v1.2.1

  - it: uses the Kubernetes capability name without the CAP_ prefix
    template: agent/agent-daemonset.yaml
    set:
      masterNodes:
        - "10.0.0.1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SYS_PTRACE
      - notContains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: CAP_SYS_PTRACE
