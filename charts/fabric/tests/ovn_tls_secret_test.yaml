suite: OVN TLS secret
templates:
  - ovn-tls-secret.yaml
tests:
  - it: renders nothing when SSL is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one secret in the release namespace when SSL is enabled
    set:
      networking.enableSsl: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: fabric-tls
      - equal:
          path: metadata.namespace
          value: kube-system
      - isNotEmpty:
          path: data.cacert
      - isNotEmpty:
          path: data.cert
      - isNotEmpty:
          path: data.key

  - it: renders a second copy in the HCP namespace when it differs
    set:
      networking.enableSsl: true
      central.hcp.enabled: true
      central.hcp.namespace: hcp
      central.hcp.nbAddress: tcp:ovn-nb.example.com:6641
      central.hcp.sbAddress: tcp:ovn-sb.example.com:6642
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: kube-system
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: hcp
        documentIndex: 1
      - equal:
          path: metadata.name
          value: fabric-tls
        documentIndex: 1
      - isNotEmpty:
          path: data.cacert
        documentIndex: 1
      - isNotEmpty:
          path: data.cert
        documentIndex: 1
      - isNotEmpty:
          path: data.key
        documentIndex: 1

  - it: renders the HCP copy for controlPlaneOnly releases
    set:
      installMode: controlPlaneOnly
      networking.enableSsl: true
      central.hcp.enabled: true
      central.hcp.namespace: hcp
      central.hcp.nbAddress: tcp:ovn-nb.example.com:6641
      central.hcp.sbAddress: tcp:ovn-sb.example.com:6642
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.namespace
          value: hcp
        documentIndex: 1

  - it: does not duplicate the secret when the HCP namespace matches the release namespace
    set:
      networking.enableSsl: true
      central.hcp.enabled: true
      central.hcp.namespace: kube-system
      central.hcp.nbAddress: tcp:ovn-nb.example.com:6641
      central.hcp.sbAddress: tcp:ovn-sb.example.com:6642
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: kube-system

  - it: does not duplicate the secret when the HCP namespace is empty
    set:
      networking.enableSsl: true
      central.hcp.enabled: true
      central.hcp.namespace: ""
      central.hcp.nbAddress: tcp:ovn-nb.example.com:6641
      central.hcp.sbAddress: tcp:ovn-sb.example.com:6642
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: kube-system

  - it: does not render the HCP copy when HCP central is disabled
    set:
      networking.enableSsl: true
      central.hcp.enabled: false
      central.hcp.namespace: hcp
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: kube-system
