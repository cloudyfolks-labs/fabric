{{- if and (include "fabric.renderDataPlane" .) .Values.apiNad.enabled }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.apiNad.name }}
  namespace: {{ .Values.namespace }}
spec:
  config: '{
      "cniVersion": "0.3.0",
      "type": "fabric",
      "server_socket": "/run/openvswitch/fabric-daemon.sock",
      "provider": "{{ tpl .Values.apiNad.provider . }}"
    }'
{{- end }}