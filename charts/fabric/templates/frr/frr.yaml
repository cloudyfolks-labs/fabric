{{- if and (include "fabric.renderDataPlane" .) .Values.frr.enabled }}
{{- $frrAgentImage := include "fabric.imageSpec" (dict "root" . "image" .Values.frr.image) | fromYaml -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-frr
  namespace: {{ .Values.namespace }}
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:fabric-frr
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - fabric.cloudyfolks.io
    resources:
      - bgp-confs
      - vpcs
      - ovn-eips
      - loadbalancer-pools
      - subnets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fabric.cloudyfolks.io
    resources:
      - bgp-confs/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fabric-frr
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:fabric-frr
subjects:
  - kind: ServiceAccount
    name: fabric-frr
    namespace: {{ .Values.namespace }}
---
kind: Service
apiVersion: v1
metadata:
  name: fabric-frr
  namespace: {{ .Values.namespace }}
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: fabric-frr
    app.kubernetes.io/part-of: fabric
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: fabric-frr
    app.kubernetes.io/part-of: fabric
  ports:
    - port: {{ .Values.frr.metrics.port }}
      name: metrics
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: fabric-frr
  namespace: {{ .Values.namespace }}
  {{- with .Values.frr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fabric-frr
      app.kubernetes.io/part-of: fabric
  template:
    metadata:
      {{- with .Values.frr.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: fabric-frr
        app.kubernetes.io/part-of: fabric
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: fabric-frr
      automountServiceAccountToken: false
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: "linux"
        fabric.cloudyfolks.io/external-gw: "true"
        {{- with .Values.frr.nodeSelector }}
        {{- toYaml . | trim | nindent 8 }}
        {{- end }}
      initContainers:
        - name: init-frr
          image: {{ $frrAgentImage.prefix }}{{ $frrAgentImage.repository }}:{{ $frrAgentImage.tag }}
          imagePullPolicy: {{ $frrAgentImage.pullPolicy }}
          command:
            - /fabric/fabric-frr
            - init
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
      containers:
        - name: frr
          image: {{ .Values.frr.frrImage.repository }}:{{ .Values.frr.frrImage.tag }}
          imagePullPolicy: {{ .Values.frr.frrImage.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - /usr/lib/frr/docker-start & exec sh /etc/frr/fabric-reload.sh
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
                - SYS_ADMIN
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
        - name: fabric-frr
          image: {{ $frrAgentImage.prefix }}{{ $frrAgentImage.repository }}:{{ $frrAgentImage.tag }}
          imagePullPolicy: {{ $frrAgentImage.pullPolicy }}
          command:
            - /fabric/fabric-frr
          args:
            - --logtostderr=false
            - --alsologtostderr=true
            - --log_file=/var/log/fabric/fabric-frr.log
            - --log_file_max_size=200
            - --pprof-port={{ .Values.frr.metrics.port }}
          {{- with .Values.frr.args }}
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.frr.metrics.port }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: frr-config
              mountPath: /etc/frr
            - name: fabric-log
              mountPath: /var/log/fabric
            - name: serviceaccount
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          {{- with .Values.frr.resources }}
          resources:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
      volumes:
        - name: frr-config
          emptyDir: {}
        - name: fabric-log
          hostPath:
            path: {{ .Values.logging.directory }}/fabric
            type: DirectoryOrCreate
        - name: serviceaccount
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
{{- end }}
