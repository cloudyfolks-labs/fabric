{{- if and (include "fabric.renderDataPlane" .) .Values.validatingWebhook.enabled }}
kind: Service
apiVersion: v1
metadata:
  name: fabric-webhook
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - name: fabric-webhook
      protocol: TCP
      port: 443
      targetPort: 8443
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fabric-webhook
    app.kubernetes.io/part-of: fabric
  sessionAffinity: None
{{- end }}