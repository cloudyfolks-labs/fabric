{{- if and (include "fabric.renderDataPlane" .) .Values.validatingWebhook.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fabric-webhook-serving-cert
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  dnsNames:
    - fabric-webhook.{{ .Values.namespace }}
    - fabric-webhook.{{ .Values.namespace }}.svc
    - fabric-webhook.{{ .Values.namespace }}.svc.{{ .Values.clusterDomain }}
  issuerRef:
    kind: Issuer
    name: fabric-webhook-selfsigned-issuer
    group: cert-manager.io
  secretName: fabric-webhook-secret
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fabric-webhook-selfsigned-issuer
  namespace: {{ .Values.namespace }}
  {{- with .Values.validatingWebhook.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.validatingWebhook.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selfSigned: {}
{{- end }}