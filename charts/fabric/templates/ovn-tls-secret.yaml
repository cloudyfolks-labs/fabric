{{- if .Values.networking.enableSsl }}
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace "fabric-tls" }}
{{- if eq (include "fabric.installMode" .) "dataPlaneOnly" }}
  {{- if not $existingSecret }}
    {{- fail (printf "installMode=dataPlaneOnly with networking.enableSsl=true requires the fabric-tls Secret in namespace %q to be pre-seeded with the SAME CA/cert/key as the management cluster's ovn-central. Self-signing locally would produce certs the management cluster does not trust, breaking every NB/SB connection. Sync the Secret from the mgmt cluster (kubectl get secret fabric-tls -o yaml | kubectl --context=tenant apply -f -) and re-run helm." .Values.namespace) }}
  {{- end }}
{{- else }}
{{- $tls := dict }}
{{- if $existingSecret }}
{{- $tls = dict "cacert" (index $existingSecret.data "cacert") "cert" (index $existingSecret.data "cert") "key" (index $existingSecret.data "key") }}
{{- else }}
{{- $ca := genCA "ovn-ca" 3650 }}
{{- $cert := genSignedCert "ovn" nil nil 3650 $ca }}
{{- $tls = dict "cacert" (b64enc $ca.Cert) "cert" (b64enc $cert.Cert) "key" (b64enc $cert.Key) }}
{{- end }}
{{- $centralNamespace := include "fabric.centralNamespace" . }}
{{- $namespaces := list .Values.namespace }}
{{- if and (include "fabric.renderControlPlane" .) (ne $centralNamespace .Values.namespace) }}
{{- $namespaces = append $namespaces $centralNamespace }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fabric-tls
  namespace: {{ . }}
data:
  cacert: {{ $tls.cacert }}
  cert: {{ $tls.cert }}
  key: {{ $tls.key }}
{{- end }}
{{- end }}
{{- end }}
