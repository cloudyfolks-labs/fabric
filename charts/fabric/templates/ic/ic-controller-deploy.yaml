{{- if and (include "fabric.renderDataPlane" .) .Values.features.enableOvnInterconnections }}
{{- $icImage := include "fabric.imageSpec" (dict "root" . "image" .Values.ic.image) | fromYaml -}}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ovn-ic-controller
  namespace: {{ .Values.namespace }}
  annotations:
    kubernetes.io/description: |
      OVN IC Client
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: ovn-ic-controller
  template:
    metadata:
      labels:
        app: ovn-ic-controller
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        {{- include "fabric.affinities.nodeAffinity" (dict "hardcodedRequired" (include "fabric.masterNodeRequired" . | fromYamlArray) "userPreferred" .Values.ic.nodeAffinity.preferredDuringSchedulingIgnoredDuringExecution "userRequired" .Values.ic.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) | nindent 8 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ovn-ic-controller
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: ovn
      automountServiceAccountToken: true
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostpath-init
          image: {{ $icImage.prefix }}{{ $icImage.repository }}:{{ $icImage.tag }}
          imagePullPolicy: {{ $icImage.pullPolicy }}
          command:
            - sh
            - -c
            - "chown -R nobody: /var/run/ovn /var/log/ovn /var/log/fabric"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            privileged: true
            runAsUser: 0
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
            - name: fabric-log
              mountPath: /var/log/fabric
      containers:
        - name: ovn-ic-controller
          image: {{ $icImage.prefix }}{{ $icImage.repository }}:{{ $icImage.tag }}
          imagePullPolicy: {{ $icImage.pullPolicy }}
          command: ["/fabric/start-ic-controller.sh"]
          args:
          - --log_file=/var/log/fabric/fabric-ic-controller.log
          - --log_file_max_size=200
          - --logtostderr=false
          - --alsologtostderr=true
          securityContext:
            runAsUser: {{ include "fabric.runAsUser" . }}
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - SYS_NICE
          env:
            - name: ENABLE_SSL
              value: "{{ .Values.networking.enableSsl }}"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.central.hcp.enabled }}
            - name: OVN_NB_ADDR
              value: "{{ include "fabric.ovnNbAddress" . }}"
            - name: OVN_SB_ADDR
              value: "{{ include "fabric.ovnSbAddress" . }}"
            {{- else }}
            - name: OVN_DB_IPS
              value: "{{ include "fabric.masterNodes" . | default (include "fabric.nodeIPs" .) }}"
            {{- end }}
            {{- with .Values.ic.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 300m
              memory: 200Mi
            limits:
              cpu: 3
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
            - mountPath: /etc/localtime
              name: localtime
            - mountPath: /var/run/tls
              name: fabric-tls
            - mountPath: /var/log/fabric
              name: fabric-log
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: host-log-ovn
          hostPath:
            path: /var/log/ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: fabric-log
          hostPath:
            path: /var/log/fabric
        - name: fabric-tls
          secret:
            optional: true
            secretName: fabric-tls
{{- end }}
