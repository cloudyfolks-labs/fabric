---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: fabric-controller
  namespace: kube-system
  annotations:
    kubernetes.io/description: |
      fabric controller
spec:
  replicas:        1
  selector:
    matchLabels:
      app: fabric-controller
  strategy:
    rollingUpdate:
      maxSurge: 0%
      maxUnavailable: 100%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: fabric-controller
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: "fabric.cloudyfolks.io/ic-gw"
                operator: NotIn
                values:
                - "true"
            weight: 100
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: fabric-controller
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: ovn
      automountServiceAccountToken: true
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostpath-init
          image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
          command:
            - sh
            - -c
            - "chown -R nobody: /var/log/fabric"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: fabric-log
              mountPath: /var/log/fabric
      containers:
        - name: fabric-controller
          image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
          imagePullPolicy: IfNotPresent
          args:
          - /fabric/start-controller.sh
          - --leader-elect-lease-duration=30s
          - --leader-elect-renew-deadline=20s
          - --leader-elect-retry-period=6s
          - --default-cidr=10.16.0.0/16
          - --default-gateway=10.16.0.1
          - --default-gateway-check=true
          - --default-logical-gateway=false
          - --default-u2o-interconnection=false
          - --default-exclude-ips=
          - --node-switch-cidr=100.64.0.0/16
          - --service-cluster-ip-range=10.96.0.0/12
          - --network-type=geneve
          - --default-interface-name=
          - --default-exchange-link-name=false
          - --default-vlan-id=100
          - --ls-dnat-mod-dl-dst=true
          - --ls-ct-skip-dst-lport-ips=true
          - --pod-nic-type=veth-pair
          - --enable-lb=true
          - --enable-ovn-lb-prefer-local=false
          - --enable-np=true
          - --np-enforcement=standard
          - --logtostderr=false
          - --alsologtostderr=true
          - --gc-interval=360
          - --inspect-interval=20
          - --log_file=/var/log/fabric/fabric-controller.log
          - --log_file_max_size=200
          - --enable-ovn-lb-svc=false
          - --keep-vm-ip=true
          - --enable-metrics=true
          - --node-local-dns-ip=
          - --skip-conntrack-dst-cidrs=
          - --enable-ovn-ipsec=false
          - --cert-manager-ipsec-cert=false
          - --secure-serving=false
          - --enable-anp=false
          - --ovsdb-con-timeout=3
          - --ovsdb-inactivity-timeout=10
          - --enable-live-migration-optimize=true
          securityContext:
            runAsUser: 65534
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
                - NET_RAW
          env:
            - name: ENABLE_SSL
              value: "false"
            - name: KUBE_OVN_TLS_ROTATION_INTERVAL
              value: "8760h"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OVN_DB_IPS
              value: "172.18.0.3"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIPs
            - name: ENABLE_BIND_LOCAL_IP
              value: "true"
          volumeMounts:
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
            - mountPath: /var/log/fabric
              name: fabric-log
            # ovn-ic log directory
            - mountPath: /var/log/ovn
              name: ovn-log
            - mountPath: /var/run/tls
              name: fabric-tls
          readinessProbe:
            httpGet:
              port: 10660
              path: /readyz
              scheme: HTTP
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              port: 10660
              path: /livez
              scheme: HTTP
            initialDelaySeconds: 300
            periodSeconds: 7
            failureThreshold: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
      nodeSelector:
        kubernetes.io/os: "linux"
        fabric/role: master
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: fabric-log
          hostPath:
            path: /var/log/fabric
        - name: ovn-log
          hostPath:
            path: /var/log/ovn
        - name: fabric-tls
          secret:
            optional: true
            secretName: fabric-tls

---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: fabric-cni
  namespace: kube-system
  annotations:
    kubernetes.io/description: |
      This daemon set launches the fabric cni daemon.
spec:
  selector:
    matchLabels:
      app: fabric-cni
  template:
    metadata:
      labels:
        app: fabric-cni
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      priorityClassName: system-node-critical
      serviceAccountName: fabric-cni
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: hostpath-init
        image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
        command:
          - sh
          - -xec
          - |
            chmod +t /usr/local/sbin
            iptables -V
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            drop:
              - ALL
          privileged: true
          runAsUser: 0
        volumeMounts:
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - mountPath: /var/run/netns
            name: host-ns
            readOnly: false
          - name: fabric-log
            mountPath: /var/log/fabric
      - name: install-cni
        image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
        imagePullPolicy: IfNotPresent
        command:
          - /fabric/install-cni.sh
          - --cni-conf-name=01-fabric.conflist
        env:
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
        securityContext:
          runAsUser: 0
          privileged: true
        volumeMounts:
          - mountPath: /opt/cni/bin
            name: cni-bin
          - mountPath: /etc/cni/net.d
            name: cni-conf
          - mountPath: /usr/local/bin
            name: local-bin
      containers:
      - name: cni-server
        image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
        imagePullPolicy: IfNotPresent
        command:
          - bash
          - /fabric/start-cniserver.sh
        args:
          - --enable-mirror=false
          - --enable-arp-detect-ip-conflict=true
          - --encap-checksum=true
          - --service-cluster-ip-range=10.96.0.0/12
          - --iface=
          - --dpdk-tunnel-iface=br-phy
          - --network-type=geneve
          - --default-interface-name=
          - --logtostderr=false
          - --alsologtostderr=true
          - --log_file=/var/log/fabric/fabric-cni.log
          - --log_file_max_size=200
          - --enable-metrics=true
          - --kubelet-dir=/var/lib/kubelet
          - --enable-tproxy=false
          - --ovs-vsctl-concurrency=100
          - --secure-serving=false
          - --enable-ovn-ipsec=false
          - --cert-manager-ipsec-cert=false
          - --ovn-ipsec-cert-duration=63072000
          - --cert-manager-issuer-name=fabric
          - --host-tunnel-src=false
        securityContext:
          runAsUser: 0
          privileged: false
          capabilities:
            add:
              - NET_ADMIN
              - NET_BIND_SERVICE
              - NET_RAW
              - SYS_ADMIN
              - SYS_NICE
              - SYS_PTRACE
        env:
          - name: ENABLE_SSL
            value: "false"
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: POD_IPS
            valueFrom:
              fieldRef:
                fieldPath: status.podIPs
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: ENABLE_BIND_LOCAL_IP
            value: "true"
          - name: DBUS_SYSTEM_BUS_ADDRESS
            value: "unix:path=/host/var/run/dbus/system_bus_socket"
        volumeMounts:
          - name: usr-local-sbin
            mountPath: /usr/local/sbin
          - name: host-modules
            mountPath: /lib/modules
            readOnly: true
          - mountPath: /run/xtables.lock
            name: xtables-lock
            readOnly: false
          - name: shared-dir
            mountPath: /var/lib/kubelet/pods
          - mountPath: /etc/openvswitch
            name: systemid
            readOnly: true
          - mountPath: /etc/ovs_ipsec_keys
            name: ovs-ipsec-keys
          - mountPath: /run/openvswitch
            name: host-run-ovs
            mountPropagation: HostToContainer
          - mountPath: /run/ovn
            name: host-run-ovn
          - mountPath: /host/var/run/dbus
            name: host-dbus
            mountPropagation: HostToContainer
          - mountPath: /var/run/netns
            name: host-ns
            mountPropagation: HostToContainer
          - mountPath: /var/log/fabric
            name: fabric-log
          - mountPath: /var/log/openvswitch
            name: host-log-ovs
          - mountPath: /var/log/ovn
            name: host-log-ovn
          - mountPath: /etc/localtime
            name: localtime
            readOnly: true
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 30
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /livez
            scheme: HTTP
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 7
          successThreshold: 1
          httpGet:
            port: 10665
            path: /readyz
            scheme: HTTP
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 1000m
            memory: 1Gi
            ephemeral-storage: 1Gi
      nodeSelector:
        kubernetes.io/os: "linux"
      volumes:
        - name: usr-local-sbin
          emptyDir: {}
        - name: host-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: shared-dir
          hostPath:
            path: /var/lib/kubelet/pods
        - name: systemid
          hostPath:
            path: /etc/origin/openvswitch
        - name: ovs-ipsec-keys
          hostPath:
            path: /etc/origin/ovs_ipsec_keys
        - name: host-run-ovs
          hostPath:
            path: /run/openvswitch
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: cni-conf
          hostPath:
            path: /etc/cni/net.d
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
        - name: host-ns
          hostPath:
            path: /var/run/netns
        - name: host-dbus
          hostPath:
            path: /var/run/dbus
        - name: host-log-ovs
          hostPath:
            path: /var/log/openvswitch
        - name: fabric-log
          hostPath:
            path: /var/log/fabric
        - name: host-log-ovn
          hostPath:
            path: /var/log/ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: local-bin
          hostPath:
            path: /usr/local/bin

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: fabric-monitor
  namespace: kube-system
  annotations:
    kubernetes.io/description: |
      Metrics for OVN components: northd, nb and sb.
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app: fabric-monitor
  template:
    metadata:
      labels:
        app: fabric-monitor
        component: network
        type: infra
    spec:
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: fabric-monitor
              topologyKey: kubernetes.io/hostname
      priorityClassName: system-cluster-critical
      serviceAccountName: fabric-app
      automountServiceAccountToken: true
      hostNetwork: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: hostpath-init
          image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
          command:
            - sh
            - -c
            - "chown -R nobody: /var/log/fabric"
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: fabric-log
              mountPath: /var/log/fabric
      containers:
        - name: fabric-monitor
          image: "ghcr.io/cloudyfolks-labs/fabric:v1.0.0"
          imagePullPolicy: IfNotPresent
          command: ["/fabric/start-ovn-monitor.sh"]
          args:
          - --secure-serving=false
          - --log_file=/var/log/fabric/fabric-monitor.log
          - --logtostderr=false
          - --alsologtostderr=true
          - --log_file_max_size=200
          - --enable-metrics=true
          securityContext:
            runAsUser: 65534
            privileged: false
            capabilities:
              add:
                - NET_BIND_SERVICE
          env:
            - name: ENABLE_SSL
              value: "false"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_IPS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIPs
            - name: ENABLE_BIND_LOCAL_IP
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 200m
              memory: 200Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /var/run/ovn
              name: host-run-ovn
            - mountPath: /etc/ovn
              name: host-config-ovn
            - mountPath: /var/log/ovn
              name: host-log-ovn
              readOnly: true
            - mountPath: /etc/localtime
              name: localtime
              readOnly: true
            - mountPath: /var/run/tls
              name: fabric-tls
            - mountPath: /var/log/fabric
              name: fabric-log
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 7
            successThreshold: 1
            httpGet:
              port: 10661
              path: /livez
              scheme: HTTP
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 7
            successThreshold: 1
            httpGet:
              port: 10661
              path: /readyz
              scheme: HTTP
            timeoutSeconds: 5
      nodeSelector:
        kubernetes.io/os: "linux"
        fabric/role: "master"
      volumes:
        - name: host-run-ovn
          hostPath:
            path: /run/ovn
        - name: host-config-ovn
          hostPath:
            path: /etc/origin/ovn
        - name: host-log-ovn
          hostPath:
            path: /var/log/ovn
        - name: localtime
          hostPath:
            path: /etc/localtime
        - name: fabric-tls
          secret:
            optional: true
            secretName: fabric-tls
        - name: fabric-log
          hostPath:
            path: /var/log/fabric
---
kind: Service
apiVersion: v1
metadata:
  name: fabric-monitor
  namespace: kube-system
  labels:
    app: fabric-monitor
spec:
  ports:
    - name: metrics
      port: 10661
  type: ClusterIP
  
  selector:
    app: fabric-monitor
  sessionAffinity: None
---
kind: Service
apiVersion: v1
metadata:
  name: fabric-controller
  namespace: kube-system
  labels:
    app: fabric-controller
spec:
  
  selector:
    app: fabric-controller
  ports:
    - port: 10660
      name: metrics
---
kind: Service
apiVersion: v1
metadata:
  name: fabric-cni
  namespace: kube-system
  labels:
    app: fabric-cni
spec:
  
  selector:
    app: fabric-cni
  ports:
    - port: 10665
      name: metrics
